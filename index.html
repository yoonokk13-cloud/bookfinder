<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookfinder | 책 검색</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 800px;
    }
    header {
      text-align: center;
      margin-bottom: 32px;
    }
    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 8px;
    }
    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }
    input[type="text"] {
      flex: 1;
      padding: 14px 18px;
      font-size: 1rem;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
    }
    button.search-btn {
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      background-color: var(--primary);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background-color 0.2s;
      white-space: nowrap;
    }
    button.search-btn:hover {
      background-color: var(--primary-hover);
    }
    #status {
      text-align: center;
      margin: 20px 0;
      font-size: 1.05rem;
      color: var(--text-muted);
    }
    #results {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      gap: 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .cover {
      width: 110px;
      min-width: 110px;
      height: 160px;
      background: #eee;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .noimg {
      font-size: 2.5rem;
    }
    .body {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .body h3 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .meta {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .desc {
      font-size: 0.92rem;
      color: #475569;
      margin-top: 8px;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.5;
    }
    .desc.expanded {
      -webkit-line-clamp: unset;
      overflow: visible;
    }
    .more-btn {
      align-self: flex-start;
      background: none;
      border: none;
      color: var(--primary);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      margin-bottom: 12px;
    }
    .link {
      margin-top: auto;
    }
    .link a {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .link a:hover {
      text-decoration: underline;
    }
    footer {
      margin-top: 50px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    footer a {
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 Bookfinder</h1>
      <p>책 제목이나 ISBN으로 검색해 보세요</p>
    </header>

    <div class="search-box">
      <input type="text" id="query" placeholder="예: 어린왕자 또는 9788932917245" autofocus>
      <button class="search-btn" id="searchBtn">검색</button>
    </div>

    <p id="status"></p>
    <div id="results"></div>

    <footer>
      도서 데이터 제공: <a href="https://www.aladin.co.kr" target="_blank" rel="noopener">알라딘 인터넷서점</a>
    </footer>
  </div>

  <script>
    const TTB_KEY = 'ttbyoonokk0230005';

    function isISBN(s) {
      const t = s.replace(/[-\s]/g, '');
      return /^(\d{10}|\d{13})$/.test(t);
    }

    // JSONP 방식으로 알라딘 API 호출 (CORS 우회)
    function fetchAladdinJSONP(url) {
      return new Promise((resolve, reject) => {
        const callbackName = 'aladdin_cb_' + Math.floor(Math.random() * 1000000);
        const script = document.createElement('script');
        const timeout = setTimeout(() => {
          cleanup();
          reject(new Error('요청 시간이 초과되었습니다.'));
        }, 10000);

        function cleanup() {
          if (script.parentNode) script.parentNode.removeChild(script);
          delete window[callbackName];
          clearTimeout(timeout);
        }

        window[callbackName] = function(data) {
          cleanup();
          resolve(data);
        };

        script.onerror = function() {
          cleanup();
          reject(new Error('알라딘 서버와 통신할 수 없습니다.'));
        };

        const delimiter = url.includes('?') ? '&' : '?';
        script.src = `${url}${delimiter}callback=${callbackName}`;
        document.body.appendChild(script);
      });
    }

    async function searchBooks(query) {
      const base = 'https://www.aladdin.co.kr/ttb/api/';
      let aladinUrl;

      if (isISBN(query)) {
        const clean = query.replace(/[-\s]/g, '');
        const idType = clean.length === 13 ? 'ISBN13' : 'ISBN';
        aladinUrl = base + 'ItemLookUp.aspx?ttbkey=' + encodeURIComponent(TTB_KEY) +
          '&itemIdType=' + idType + '&ItemId=' + encodeURIComponent(clean) +
          '&output=js&Version=20131101&Cover=Big&OptResult=fulldescription';
      } else {
        aladinUrl = base + 'ItemSearch.aspx?ttbkey=' + encodeURIComponent(TTB_KEY) +
          '&Query=' + encodeURIComponent(query) + '&QueryType=Title' +
          '&MaxResults=20&start=1&SearchTarget=Book' +
          '&output=js&Version=20131101&Cover=Big';
      }

      const data = await fetchAladdinJSONP(aladinUrl);

      if (data.errorCode) {
        throw new Error(data.errorMessage || 'API 오류');
      }
      return data.item || [];
    }

    function escapeHtml(s) {
      return String(s || '').replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function cleanDesc(raw) {
      return String(raw || '').replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
    }

    function cardHtml(item) {
      const cover = item.cover
        ? `<img src="${item.cover}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<span class=\\'noimg\\'>📕</span>'">`
        : `<span class="noimg">📕</span>`;
      const desc = cleanDesc(item.fullDescription || item.description);
      return `
        <div class="card">
          <div class="cover">${cover}</div>
          <div class="body">
            <h3>${escapeHtml(item.title)}</h3>
            <p class="meta">${escapeHtml(item.author || '저자 미상')}</p>
            <p class="meta">${escapeHtml(item.publisher || '')} ${item.pubDate ? '· ' + escapeHtml(item.pubDate) : ''}</p>
            ${desc ? `<p class="desc">${escapeHtml(desc)}</p><button class="more-btn" data-toggle>더보기</button>` : ''}
            <p class="link"><a href="${item.link || '#'}" target="_blank" rel="noopener">알라딘에서 보기 ↗</a></p>
          </div>
        </div>`;
    }

    const queryInput = document.getElementById('query');
    const searchBtn = document.getElementById('searchBtn');
    const statusEl = document.getElementById('status');
    const resultsEl = document.getElementById('results');

    async function handleSearch() {
      const q = queryInput.value.trim();
      if (!q) return;

      statusEl.textContent = '검색 중입니다...';
      resultsEl.innerHTML = '';

      try {
        const items = await searchBooks(q);
        if (items.length === 0) {
          statusEl.textContent = '검색 결과가 없습니다.';
        } else {
          statusEl.textContent = `총 ${items.length}건의 도서를 찾았습니다.`;
          resultsEl.innerHTML = items.map(cardHtml).join('');
        }
      } catch (err) {
        statusEl.textContent = `검색 중 문제가 발생했어요. (${err.message})`;
      }
    }

    searchBtn.addEventListener('click', handleSearch);
    queryInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleSearch();
    });

    resultsEl.addEventListener('click', (e) => {
      if (e.target.matches('[data-toggle]')) {
        const desc = e.target.previousElementSibling;
        if (desc && desc.classList.contains('desc')) {
          desc.classList.toggle('expanded');
          e.target.textContent = desc.classList.contains('expanded') ? '접기' : '더보기';
        }
      }
    });
  </script>
</body>
</html>
